name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Kiem tra kieu du lieu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cai thu vien
        run: npm ci --no-audit --no-fund

      - name: Kiem tra kieu (typecheck)
        run: npm run typecheck
